<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="purpleGlow" cx="25%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="80%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulseWave {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes beamFlow {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 300px 150px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 900px 250px; }
    .pill-anim-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-anim-2 { animation: floatPill 6s ease-in-out 1s infinite; }
    .pill-anim-3 { animation: floatPill 5.5s ease-in-out 2s infinite; }
    .wave-line {
      stroke-dasharray: 200 100;
      animation: pulseWave 12s linear infinite;
    }
    .laser-beam {
      animation: beamFlow 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Digital Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Glowing Ambient Orbs (Background Layer) -->
  <g class="orb-1">
    <circle cx="300" cy="140" r="260" fill="url(#purpleGlow)" />
  </g>
  <g class="orb-2">
    <circle cx="950" cy="270" r="280" fill="url(#cyanGlow)" />
  </g>

  <!-- Flowing Dynamic Cyber Paths (Background / Middle Layer) -->
  <g opacity="0.45">
    <path d="M -50,330 C 250,220 400,390 700,280 C 1000,170 1100,350 1250,260" fill="none" stroke="#6366f1" stroke-width="2.5" class="wave-line" />
    <path d="M -50,120 C 300,250 550,80 800,220 C 1050,360 1150,150 1250,200" fill="none" stroke="#06b6d4" stroke-width="1.8" class="wave-line" />
    <!-- Floating particle nodes -->
    <circle cx="250" cy="220" r="4" fill="#38bdf8" opacity="0.8" />
    <circle cx="400" cy="390" r="3" fill="#c084fc" opacity="0.8" />
    <circle cx="700" cy="280" r="5" fill="#f472b6" opacity="0.9" />
    <circle cx="1000" cy="170" r="4" fill="#818cf8" opacity="0.8" />
  </g>

  <!-- Dynamic Laser Line -->
  <g opacity="0.3">
    <line x1="0" y1="2" x2="1200" y2="2" stroke="#6366f1" stroke-width="2" />
    <circle cx="0" cy="2" r="40" fill="#38bdf8" filter="blur(8px)" class="laser-beam" />
  </g>

  <!-- Floating Feature Pills (Framing the Canvas) -->
  <g class="pill-anim-1">
    <g transform="translate(140, 50)">
      <rect width="180" height="34" rx="17" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="20" cy="17" r="5" fill="#10b981" />
      <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ Prompt-to-Website</text>
    </g>
  </g>

  <g class="pill-anim-2">
    <g transform="translate(880, 55)">
      <rect width="200" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="20" cy="17" r="5" fill="#38bdf8" />
      <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🤖 Agentic Workflows</text>
    </g>
  </g>

  <g class="pill-anim-3">
    <g transform="translate(900, 340)">
      <rect width="185" height="34" rx="17" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="20" cy="17" r="5" fill="#c084fc" />
      <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🚀 100% Self-Hostable</text>
    </g>
  </g>

  <g class="pill-anim-1">
    <g transform="translate(120, 340)">
      <rect width="190" height="34" rx="17" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="20" cy="17" r="5" fill="#f472b6" />
      <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🎨 Modern UI / Next.js</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed pristine contrast & hierarchy -->
  <g filter="url(#shadow)">
    <!-- Category Badge -->
    <g transform="translate(485, 95)">
      <rect width="230" height="28" rx="14" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6" />
      <text x="115" y="19" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.8">
      AI Website Builders &amp; Orchestration
    </text>

    <!-- Subtitle -->
    <text x="600" y="232" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#f1f5f9" letter-spacing="0.2">
      Top AI Landing Page Generators, Visual Builders &amp; Agentic Engines
    </text>

    <!-- Tagline Description -->
    <text x="600" y="268" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="0.4">
      Open-Source Self-Hosted Software • SaaS Commercial Leaders • Real-Time Star Trackers
    </text>
  </g>
</svg>